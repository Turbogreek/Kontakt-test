<!DOCTYPE html>
<html>
<head>
<style>
.center {
 
    display: flex;
    justify-content: center;
    align-items: center;
    height: 1vh;
    text-align: center;
}
.split-container {
  display: grid;
 width: 80%;
 height: 400px;
 box-shadow: 0 4px 10px 
}
.left, .right {
  padding: 20px;
}
.static {
  display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    height: 1vh;
}
body {
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background-color: rgb(240, 240, 240);
}

h1 {
  color: rgb(5, 0, 0);
  text-align: center;
}

p {
  font-family: Open Sans, sans-serif;
  font-size: 20px;
}
</style>
</head>
<body>
<div class="center">
<h1>Oliver Trakossas</h1>
<div></div>
<div class="static">
<p> ____________________________________</p>
</div>

<div class="center, split-container">
  <div class="left">
    <h2>Udannelse</h2>
    <p>TEC Data og kommunikation, 2025 </p>
  </div>
  <div class="right">
    <h2>Erfaring</h2>
    <p></p>
  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt</title>
    </head>

    
    <body>
    <ul class="nav menu-box" >
  <li><a href="index.html">Forside</a></li>
  <li><a href="project.html">Projekter</a></li>
  <li><a href="kontakt.html">Kontakt mig</a></li>
</ul>
<div class="kontakt-container">
  <h2>Kontakt Mig</h2>
  <form id="kontaktForm" action="https://formsubmit.co/ajax/oli3520@hotmail.com" method="POST">
    
    <input type="text" name="_honey" style="display:none">

    <input type="hidden" name="_next" value="https://turbogreek.github.io/Kontakt-test/">

    <label for="navn">Navn:</label>
    <input type="text" id="navn" name="navn" placeholder="Dit navn.." required>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Din email.." required>

    <label for="telefon">Telefon:</label>
    <input type="text" id="telefon" name="telefon" placeholder="Dit telefonnummer..">

    <label for="besked">Besked:</label>
    <textarea id="besked" name="besked" placeholder="Skriv din besked her.." style="height:150px" required></textarea>

    <button type="submit">Send besked</button>
    
  </form>
 </div>
 <script>
  const form = document.getElementById('kontaktForm');

  form.addEventListener('submit', function(event) {
    event.preventDefault();

    const data = {
      name: document.getElementById('navn').value,
      email: document.getElementById('email').value,
      telefon: document.getElementById('telefon').value,
      message: document.getElementById('besked').value
    };

    fetch(form.action, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
        },
        body: JSON.stringify(data)
    })
    .then(response => {
        if (response.ok) {
            alert('Mailen er sendt!');
            form.reset();
            
            // HER ER DEN NYE LINJE: Sender brugeren tilbage til forsiden
            window.location.href = "index.html"; 
            
        } else {
            alert('Der skete en fejl. Prøv igen.');
        }
    })
    .catch(error => {
        alert('Der kunne ikke oprettes forbindelse.');
    });
  });
</script>
 </body>
</html>
